name: Deploy to GitHub Pages

# The site is a static build, so nothing is committed to the repo — Pages is
# served from the artifact this workflow uploads. Before the first run, set
# Settings → Pages → Source to "GitHub Actions".

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight one finish rather than
# cancelling it half-way through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # This repo is a *user* site (kole-swapnil.github.io), served from the
      # domain root, so BASE_PATH stays '/'. For a project site published at
      # /<repo>/, set BASE_PATH to '/<repo>/' here.
      - run: npm run build
        env:
          BASE_PATH: /

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
